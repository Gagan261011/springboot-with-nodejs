version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: user_management_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-user_management}
      POSTGRES_USER: ${DB_USER:-um_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-um_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-um_admin} -d ${DB_NAME:-user_management}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: user_management_api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-user_management}
      DB_USER: ${DB_USER:-um_admin}
      DB_PASSWORD: ${DB_PASSWORD:-um_secret}
      SERVER_PORT: ${BACKEND_PORT:-8095}
    ports:
      - '${BACKEND_PORT:-8095}:${BACKEND_PORT:-8095}'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${BACKEND_PORT:-8095}/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: user_management_web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${NGINX_PORT:-80}:80'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres-data:

networks:
  internal:
    driver: bridge
